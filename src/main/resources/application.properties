spring.application.name=ms-analytics-recommendations
server.port=${PORT:8090}
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5439/pedidos360_analytics}
spring.datasource.username=${DATASOURCE_USER:pedidos360}
spring.datasource.password=${DATASOURCE_PASSWORD:pedidos360}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
